openapi: 3.2.0
info:
  title: Microsoft Endpoint Configuration Management Configuration Manager REST API (AdminService) Packages API
  description: REST API for managing Configuration Manager resources including collections, deployments, applications, and device queries. The administration service is based on the OData v4 protocol and supports both WMI and versioned OData routes. Class names are case-sensitive.
  version: 1.0.0
  contact:
    name: Microsoft Configuration Manager Support
    url: https://learn.microsoft.com/en-us/intune/configmgr/develop/adminservice/overview
  license:
    name: Microsoft API License
    url: https://learn.microsoft.com/en-us/legal/microsoft-apis/terms-of-use
servers:
- url: https://{siteserver}/AdminService
  description: Configuration Manager AdminService endpoint
  variables:
    siteserver:
      default: smsproviderfqdn
      description: Fully qualified domain name of the SMS Provider server hosting the administration service.
security:
- windowsAuth: []
- oauth2: []
tags:
- name: Packages
  description: Manage legacy software packages.
paths:
  /wmi/SMS_Package:
    get:
      operationId: listPackages
      summary: Microsoft Endpoint Configuration Management List packages
      description: Retrieve all legacy packages in Configuration Manager.
      tags:
      - Packages
      parameters:
      - $ref: '#/components/parameters/top'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/select'
      responses:
        '200':
          description: Successful response returning packages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/SMS_Package'
components:
  parameters:
    select:
      name: $select
      in: query
      description: Comma-separated list of properties to include.
      schema:
        type: string
    filter:
      name: $filter
      in: query
      description: OData filter expression.
      schema:
        type: string
    top:
      name: $top
      in: query
      description: Number of items to return.
      schema:
        type: integer
  schemas:
    SMS_Package:
      type: object
      description: Represents a legacy package in Configuration Manager.
      properties:
        PackageID:
          type: string
          description: Unique package identifier.
        Name:
          type: string
          description: Package name.
        Description:
          type: string
          description: Package description.
        Manufacturer:
          type: string
          description: Manufacturer.
        Version:
          type: string
          description: Package version.
        SourceDate:
          type: string
          format: date-time
          description: Source content date.
        PackageType:
          type: integer
          description: Type of package.
  securitySchemes:
    windowsAuth:
      type: http
      scheme: negotiate
      description: Windows Integrated Authentication (Kerberos/NTLM).
    oauth2:
      type: oauth2
      description: OAuth 2.0 via Azure AD for cloud management gateway access.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
          scopes: {}
